name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 로컬 에디터·CLI와 같은 clang-format 23.1.3으로 추적 중인 C++ 소스 전체를 검사한다.
      - name: clang-format --dry-run --Werror
        run: |
          pipx install clang-format==23.1.3
          cf="$(pipx environment --value PIPX_BIN_DIR)/clang-format"
          "$cf" --version
          git ls-files -z '*.cpp' '*.hpp' | xargs -0 "$cf" --dry-run --Werror

  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, release]
    steps:
      - uses: actions/checkout@v4
      # workflow preset 하나가 configure + build + ctest를 모두 수행한다.
      # debug: 개발 기본, asan: ASan/UBSan 위생 검사, release: -O3 + 경고 = 에러
      - name: cmake --workflow --preset ${{ matrix.preset }}
        run: cmake --workflow --preset ${{ matrix.preset }}
