# Controller 1개와 단일 Group의 AgentFleet을 Prometheus·Grafana와 함께 실행한다.
# 실행: DDCS_FLEET_COUNT=10000 DDCS_FLEET_GROUP=zone_a \
#   docker compose -f docker/docker-compose.fleet-monitoring.yml up --build -d
# 종료: docker compose -f docker/docker-compose.fleet-monitoring.yml down
# Grafana: http://localhost:3000 · Prometheus: http://localhost:9090

services:
  controller:
    extends:
      file: docker-compose.fleet.yml
      service: controller
    networks:
      - ddcs

  agent-fleet:
    extends:
      file: docker-compose.fleet.yml
      service: agent-fleet
    networks:
      - ddcs

  prometheus:
    extends:
      file: docker-compose.yml
      service: prometheus

  grafana:
    extends:
      file: docker-compose.yml
      service: grafana

volumes:
  grafana-data:

networks:
  ddcs:
    driver: bridge
