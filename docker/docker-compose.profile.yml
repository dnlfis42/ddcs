# 기본 Compose에 Controller 프로파일 기록 설정과 출력 디렉터리를 추가한다.
# 수동 실행 예:
#   DDCS_PROFILE_OUTPUT_DIR=/absolute/output DDCS_PROFILE_RUN_ID=run-001 \
#     DDCS_PROFILE_ENABLED=true DDCS_PROFILE_CAPACITY=16384 \
#     docker compose -f docker/docker-compose.yml -f docker/docker-compose.profile.yml up
#
# capture-controller-profile.sh는 실행마다 출력 디렉터리를 만들고,
# Controller에 SIGTERM을 보낸 뒤 저장된 프로파일을 검증한다.

services:
  controller:
    environment:
      # 작업 디렉터리와 관계없이 마운트된 설정 파일을 읽는다.
      DDCS_CONFIG_PATH: /config/controller.json
      DDCS_PROFILE_ENABLED: "${DDCS_PROFILE_ENABLED:?DDCS_PROFILE_ENABLED is required}"
      DDCS_PROFILE_CAPACITY: "${DDCS_PROFILE_CAPACITY:?DDCS_PROFILE_CAPACITY is required}"
      DDCS_PROFILE_OUTPUT_PATH: /profile-output/tick-profile.json
      DDCS_PROFILE_RUN_ID: "${DDCS_PROFILE_RUN_ID:?DDCS_PROFILE_RUN_ID is required}"
    volumes:
      - "${DDCS_PROFILE_OUTPUT_DIR:?DDCS_PROFILE_OUTPUT_DIR is required}:/profile-output"
