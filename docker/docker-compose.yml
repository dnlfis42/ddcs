# Controller 1개와 Agent 4개를 실행한다. 각 Group에 Agent를 하나씩 배치한다.
# 고정된 Device ID로 재접속 시 기존 연결이 교체되는 동작을 확인할 수 있다.
# 실행: docker compose -f docker/docker-compose.yml up --build
#
# Controller TCP: localhost:8080
# 메트릭: http://localhost:9000/metrics
# Prometheus: http://localhost:9090
# Grafana: http://localhost:3000 (로그인 없이 조회 가능)
#
# Prometheus가 Controller 메트릭을 수집하고 Grafana가 대시보드로 표시한다.
# config/를 마운트하므로 설정 변경에 이미지 재빌드는 필요하지 않다.
# 정책은 SIGHUP으로 다시 읽고, 나머지 설정은 프로세스를 재시작해 적용한다.

services:
  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: controller
    container_name: ddcs-controller
    image: ddcs-controller:dev
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  agent-01:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: agent
    image: ddcs-agent:dev
    depends_on:
      - controller
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_ID: "11111111-1111-1111-1111-111111111111"
      DDCS_DEVICE_GROUP: zone_a
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  agent-02:
    image: ddcs-agent:dev
    depends_on:
      - controller
      - agent-01
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_ID: "22222222-2222-2222-2222-222222222222"
      DDCS_DEVICE_GROUP: zone_b
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  agent-03:
    image: ddcs-agent:dev
    depends_on:
      - controller
      - agent-01
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_ID: "33333333-3333-3333-3333-333333333333"
      DDCS_DEVICE_GROUP: zone_c
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  agent-04:
    image: ddcs-agent:dev
    depends_on:
      - controller
      - agent-01
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_ID: "44444444-4444-4444-4444-444444444444"
      DDCS_DEVICE_GROUP: zone_d
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ddcs-prometheus
    depends_on:
      - controller
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ddcs

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ddcs-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ddcs-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - ddcs

volumes:
  grafana-data:

networks:
  ddcs:
    driver: bridge
