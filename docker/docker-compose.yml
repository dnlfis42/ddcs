# docker compose -f docker/docker-compose.yml up --build
# controller 1 + agent 4 (zone당 1대) --- agent들은 DDCS_DEVICE_ID로 고정 식별 (kick-old 검증용)
# 관측 스택: prometheus가 controller:9000(컨테이너 내부)을 scrape, grafana가 시각화
# - 컨트롤 서버   : localhost:8080 (wire)
# - 원시 메트릭   : http://localhost:9000/metrics
# - Prometheus UI : http://localhost:9090
# - Grafana UI    : http://localhost:3000 (anonymous Viewer)
# config/ 를 컨테이너에 마운트해 이미지 재빌드 없이 런타임 설정을 갱신한다.
services:
  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: controller
    container_name: ddcs-controller
    image: ddcs-controller:dev
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  agent-01:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: agent
    image: ddcs-agent:dev
    depends_on:
      - controller
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_ID: "11111111-1111-1111-1111-111111111111"
      DDCS_DEVICE_GROUP: zone_a
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  agent-02:
    image: ddcs-agent:dev
    depends_on:
      - controller
      - agent-01
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_ID: "22222222-2222-2222-2222-222222222222"
      DDCS_DEVICE_GROUP: zone_b
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  agent-03:
    image: ddcs-agent:dev
    depends_on:
      - controller
      - agent-01
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_ID: "33333333-3333-3333-3333-333333333333"
      DDCS_DEVICE_GROUP: zone_c
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  agent-04:
    image: ddcs-agent:dev
    depends_on:
      - controller
      - agent-01
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_ID: "44444444-4444-4444-4444-444444444444"
      DDCS_DEVICE_GROUP: zone_d
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ddcs-prometheus
    depends_on:
      - controller
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ddcs

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ddcs-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ddcs-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - ddcs

volumes:
  grafana-data:

networks:
  ddcs:
    driver: bridge
