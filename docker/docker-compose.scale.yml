# Group마다 Agent 컨테이너 25개씩, 총 100개로 그룹 정책을 검증한다.
# 실행: docker compose -f docker/docker-compose.scale.yml up -d
# docker-compose.yml과 컨테이너 이름 및 호스트 포트를 공유하므로 동시에 실행할 수 없다.
# Agent는 시작 시 Device ID를 생성한다. Group별 부하 임계값은 config/controller.json을 따른다.
# Fleet을 사용하는 성능 측정은 scripts/performance/measure-scalability.sh로 실행한다.

services:
  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: controller
    container_name: ddcs-controller
    image: ddcs-controller:dev
    ports:
      - "8080:8080"
      - "9000:9000"
    # 메모리 부족 시 Controller가 종료 대상으로 선택될 가능성을 낮춘다.
    oom_score_adj: -800
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  agent-zone-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: agent
    image: ddcs-agent:dev
    depends_on:
      - controller
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_GROUP: zone_a
    volumes:
      - ../config:/config:ro
    deploy:
      replicas: 25
    networks:
      - ddcs

  agent-zone-b:
    image: ddcs-agent:dev
    depends_on:
      - controller
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_GROUP: zone_b
    volumes:
      - ../config:/config:ro
    deploy:
      replicas: 25
    networks:
      - ddcs

  agent-zone-c:
    image: ddcs-agent:dev
    depends_on:
      - controller
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_GROUP: zone_c
    volumes:
      - ../config:/config:ro
    deploy:
      replicas: 25
    networks:
      - ddcs

  agent-zone-d:
    image: ddcs-agent:dev
    depends_on:
      - controller
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_GROUP: zone_d
    volumes:
      - ../config:/config:ro
    deploy:
      replicas: 25
    networks:
      - ddcs

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ddcs-prometheus
    depends_on:
      - controller
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ddcs

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ddcs-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ddcs-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - ddcs

volumes:
  grafana-data:

networks:
  ddcs:
    driver: bridge
