# 스케일 테스트: zone_a/b/c/d 각 25대(총 100) 로 멀티그룹 정책 검증.
#   docker compose -f docker/docker-compose.scale.yml up -d
# 메인 compose 와 호스트 포트가 겹치므로 먼저:  docker compose -f docker/docker-compose.yml down
# kick-old 가 아니라 그룹 집계가 목적이라 UUID 는 고정하지 않고 자가발급(ephemeral)한다.
# 네 zone 은 의도적으로 부하 임계가 달라 서로 다르게 동작한다(controller.json 의 policy 참고).
# 성능 램프(scripts/perf-ramp.sh)는 이 파일을 --scale 로 덮어써 총 1000대(zone당 250)까지 올린다.
# controller 의 nofile ulimit 은 그 목표(연결 1000+)에 맞춘 값이다.
services:
  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: controller
    container_name: ddcs-controller
    image: ddcs-controller:dev
    ports:
      - "8080:8080"
      - "9000:9000"
    # 측정 대상 보호: 호스트 메모리 압박 시 OOM killer가 agent 쪽을 먼저 고르게 한다.
    oom_score_adj: -800
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ../config:/config:ro
    networks:
      - ddcs

  agent-zone-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: agent
    image: ddcs-agent:dev
    depends_on:
      - controller
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_GROUP: zone_a
    volumes:
      - ../config:/config:ro
    deploy:
      replicas: 25
    networks:
      - ddcs

  agent-zone-b:
    image: ddcs-agent:dev
    depends_on:
      - controller
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_GROUP: zone_b
    volumes:
      - ../config:/config:ro
    deploy:
      replicas: 25
    networks:
      - ddcs

  agent-zone-c:
    image: ddcs-agent:dev
    depends_on:
      - controller
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_GROUP: zone_c
    volumes:
      - ../config:/config:ro
    deploy:
      replicas: 25
    networks:
      - ddcs

  agent-zone-d:
    image: ddcs-agent:dev
    depends_on:
      - controller
    environment:
      DDCS_TRANSPORT_HOST: controller
      DDCS_TRANSPORT_PORT: "8080"
      DDCS_DEVICE_GROUP: zone_d
    volumes:
      - ../config:/config:ro
    deploy:
      replicas: 25
    networks:
      - ddcs

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ddcs-prometheus
    depends_on:
      - controller
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ddcs

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ddcs-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ddcs-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - ddcs

volumes:
  grafana-data:

networks:
  ddcs:
    driver: bridge
