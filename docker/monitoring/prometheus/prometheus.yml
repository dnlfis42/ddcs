# DDCS controller metrics scrape config.
# controller 는 같은 compose 네트워크에서 controller:9090 으로 Prometheus text 를 노출한다.
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: ddcs-controller
    metrics_path: /metrics
    static_configs:
      - targets: ["controller:9000"]
        labels:
          service: ddcs-controller
