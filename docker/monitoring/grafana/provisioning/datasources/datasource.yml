# Prometheus를 기본 데이터 소스로 등록한다. 대시보드는 uid로 이 데이터 소스를 참조한다.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: ddcs-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Prometheus 수집 주기와 맞춰 Grafana의 $__rate_interval 계산에 사용한다.
      timeInterval: "1s"
