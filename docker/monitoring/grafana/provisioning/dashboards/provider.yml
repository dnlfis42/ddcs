# /var/lib/grafana/dashboards 의 JSON 대시보드를 부팅 시 자동 적재한다.
apiVersion: 1

providers:
  - name: ddcs
    orgId: 1
    folder: DDCS
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
