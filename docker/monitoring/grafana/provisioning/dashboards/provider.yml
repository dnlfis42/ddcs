# Grafana 시작 시 /var/lib/grafana/dashboards의 JSON 대시보드를 불러온다.

apiVersion: 1

providers:
  - name: ddcs
    orgId: 1
    folder: DDCS
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
